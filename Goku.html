<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Goku</title>

    <style>
        body {
            background-color: black; 
            color: white;            
            text-align: center;     
            font-family: Arial, sans-serif;
        }

        #descripcion {
            display: none;
            margin-top: 15px;
            font-size: 18px;
        }

        img {
            margin-top: 20px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Imagen -->
    <img 
        src="8055763.jpg"
        alt="Goku"
        width="900"
    >

    <br>

    <!-- Boton -->
    <button onclick="MostrarDescripcion()">
        Leer descripción
    </button>

    <!-- Descripcion -->
    <p id="descripcion">
        Goku es un guerrero saiyajin criado en la Tierra. Destaca por su corazón
        puro, su enorme poder y su deseo constante de superarse para proteger
        a quienes ama.
    </p>

    <!-- JavaScript -->
    <script>
        function MostrarDescripcion() {
            document.getElementById("descripcion").style.display = "block";
        }
    </script>

</body>
</html>
